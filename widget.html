<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Health Dashboard</title>
    <style>
      :root {
        --blue: #111bf5;
        --green: #22c55e;
        --yellow: #f59e0b;
        --red: #ef4444;
        --orange: #f97316;
        --gray-bg: #f6f8fb;
        --card-bg: #ffffff;
        --text: #0b0b0f;
        --muted: #6c768a;
        --border: #e2e8f0;
        --radius: 14px;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        width: 100%;
        min-height: 100%;
        background: var(--gray-bg);
        font-family: "Inter", system-ui, -apple-system, sans-serif;
        color: var(--text);
      }

      body { padding: 16px; }

      .card {
        background: var(--card-bg);
        border-radius: var(--radius);
        padding: 20px;
        box-shadow: 0 4px 20px rgba(15, 23, 42, 0.07);
        max-width: 420px;
        margin: 0 auto;
      }

      .card-title {
        font-size: 1.15rem;
        font-weight: 700;
        margin-bottom: 18px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      /* ─── BMI Result ─── */
      .bmi-number {
        font-size: 3.2rem;
        font-weight: 800;
        line-height: 1;
        margin-bottom: 4px;
      }

      .bmi-category {
        font-size: 1rem;
        font-weight: 600;
        margin-bottom: 16px;
      }

      .bmi-bar-wrap {
        background: var(--border);
        border-radius: 99px;
        height: 10px;
        margin-bottom: 6px;
        position: relative;
        overflow: hidden;
      }

      .bmi-bar-fill {
        position: absolute;
        left: 0; top: 0; bottom: 0;
        border-radius: 99px;
        transition: width 0.6s cubic-bezier(.4,0,.2,1);
      }

      .bmi-range-labels {
        display: flex;
        justify-content: space-between;
        font-size: 0.7rem;
        color: var(--muted);
        margin-bottom: 18px;
      }

      /* ─── Stats grid ─── */
      .stats-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 18px;
      }

      .stat-box {
        background: var(--gray-bg);
        border-radius: 10px;
        padding: 12px 14px;
      }

      .stat-label {
        font-size: 0.72rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin-bottom: 4px;
      }

      .stat-value {
        font-size: 1.1rem;
        font-weight: 700;
      }

      /* ─── Advice ─── */
      .advice-box {
        background: #f0f7ff;
        border-left: 3px solid var(--blue);
        border-radius: 8px;
        padding: 12px 14px;
        font-size: 0.88rem;
        line-height: 1.55;
        color: #1e3a5f;
      }

      /* ─── History list ─── */
      .history-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .history-item {
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--gray-bg);
        border-radius: 10px;
        padding: 10px 12px;
      }

      .history-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex-shrink: 0;
      }

      .history-meta {
        flex: 1;
        font-size: 0.82rem;
        color: var(--muted);
      }

      .history-bmi {
        font-size: 1rem;
        font-weight: 700;
      }

      /* ─── Empty ─── */
      .empty {
        text-align: center;
        padding: 30px 0;
        color: var(--muted);
        font-size: 0.9rem;
      }

      /* ─── Color helpers ─── */
      .color-blue   { color: var(--blue);   }
      .color-green  { color: var(--green);  }
      .color-yellow { color: var(--yellow); }
      .color-red    { color: var(--red);    }
      .color-orange { color: var(--orange); }
      .bg-blue      { background: var(--blue);   }
      .bg-green     { background: var(--green);  }
      .bg-yellow    { background: var(--yellow); }
      .bg-red       { background: var(--red);    }
      .bg-orange    { background: var(--orange); }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="module">
      // If you want widget visible in browser (debug mode)
      // This makes /widget show preview
      const data =
        window.openai?.toolOutput ??
        {
          bmi: 22.4,
          category: "Normal weight",
          name: "Demo User",
          healthy_weight_range: "60–75 kg",
          advice: "Demo preview mode"
        };

      // ─── Helpers ───────────────────────────────────────────────
      function bmiColor(bmi) {
        if (bmi < 18.5) return "blue";
        if (bmi < 25)   return "green";
        if (bmi < 30)   return "yellow";
        if (bmi < 35)   return "orange";
        return "red";
      }

      function bmiBarWidth(bmi) {
        // map 10–45+ onto 0–100%
        const clamped = Math.min(Math.max(bmi, 10), 45);
        return ((clamped - 10) / 35) * 100;
      }

      // ─── Render BMI result ─────────────────────────────────────
      function renderBMI(data) {
        const color = bmiColor(data.bmi);
        return `
          <div class="card">
            <div class="card-title">📊 BMI Result</div>

            <div class="bmi-number color-${color}">${data.bmi}</div>
            <div class="bmi-category color-${color}">${data.category}</div>

            <div class="bmi-bar-wrap">
              <div class="bmi-bar-fill bg-${color}"
                   style="width: ${bmiBarWidth(data.bmi)}%"></div>
            </div>
            <div class="bmi-range-labels">
              <span>Underweight<br>&lt;18.5</span>
              <span>Normal<br>18.5–24.9</span>
              <span>Overweight<br>25–29.9</span>
              <span>Obese<br>30+</span>
            </div>

            <div class="stats-grid">
              <div class="stat-box">
                <div class="stat-label">Weight</div>
                <div class="stat-value">${data.weight_kg} kg</div>
              </div>
              <div class="stat-box">
                <div class="stat-label">Height</div>
                <div class="stat-value">${data.height_cm} cm</div>
              </div>
              <div class="stat-box">
                <div class="stat-label">Healthy weight range</div>
                <div class="stat-value">${data.healthy_weight_range}</div>
              </div>
              <div class="stat-box">
                <div class="stat-label">BMI</div>
                <div class="stat-value class color-${color}">${data.bmi}</div>
              </div>
            </div>

            <div class="advice-box">${data.advice}</div>
          </div>`;
      }

      // ─── Render history list ───────────────────────────────────
      function renderHistory(entries) {
        if (!entries || entries.length === 0) {
          return `
            <div class="card">
              <div class="card-title">📋 BMI History</div>
              <div class="empty">No records yet. Ask me to calculate your BMI!</div>
            </div>`;
        }

        const items = entries.map(e => {
          const color = bmiColor(e.bmi);
          return `
            <div class="history-item">
              <div class="history-dot bg-${color}"></div>
              <div style="flex:1">
                <div style="font-weight:600;font-size:.9rem">${e.name || "Record"}</div>
                <div class="history-meta">${e.weight_kg} kg · ${e.height_cm} cm · ${e.category}</div>
              </div>
              <div class="history-bmi color-${color}">${e.bmi}</div>
            </div>`;
        }).join("");

        return `
          <div class="card">
            <div class="card-title">📋 BMI History (${entries.length})</div>
            <div class="history-list">${items}</div>
          </div>`;
      }

      // ─── Boot ──────────────────────────────────────────────────
      function mount(output) {
        const root = document.getElementById("root");
        if (!output) {
          root.innerHTML = `
            <div class="card">
              <div class="empty">Loading health data…</div>
            </div>`;
          return;
        }

        // Decide which view to render based on tool output shape
        if (output.entries !== undefined) {
          root.innerHTML = renderHistory(output.entries);
        } else if (output.bmi !== undefined) {
          root.innerHTML = renderBMI(output);
        } else {
          root.innerHTML = `
            <div class="card">
              <div class="empty">Ask me to calculate a BMI or show history.</div>
            </div>`;
        }
      }

      // Initial render from toolOutput injected by ChatGPT or demo data
      mount(data);

      // Live updates when ChatGPT rerenders the widget
      window.addEventListener("openai:set_globals", (event) => {
        const output = event.detail?.globals?.toolOutput ?? null;
        mount(output);
      }, { passive: true });
    </script>
  </body>
</html>
