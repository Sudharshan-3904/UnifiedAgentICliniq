<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.5);
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --accent-underweight: #38bdf8;
            --accent-normal: #4ade80;
            --accent-overweight: #fbbf24;
            --accent-obese: #f43f5e;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: 'Inter', -apple-system, sans-serif;
            background: transparent;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .bmi-widget {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 32px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .title {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            color: var(--text-main);
        }

        .badge {
            padding: 6px 12px;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .bmi-value-container {
            text-align: center;
            margin-bottom: 32px;
            position: relative;
        }

        .bmi-number {
            font-size: 4rem;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px var(--primary-glow));
        }

        .category-label {
            font-size: 1.125rem;
            font-weight: 500;
            color: var(--text-dim);
        }

        .gauge-container {
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 999px;
            margin-bottom: 32px;
            overflow: hidden;
            position: relative;
        }

        .gauge-bar {
            height: 100%;
            width: 0%;
            border-radius: 999px;
            transition: width 1.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            background: var(--primary);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 16px;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 1rem;
            font-weight: 600;
        }

        /* Category Specific Styles */
        .category-underweight { color: var(--accent-underweight); }
        .bg-underweight { background: var(--accent-underweight); }
        
        .category-normal { color: var(--accent-normal); }
        .bg-normal { background: var(--accent-normal); }
        
        .category-overweight { color: var(--accent-overweight); }
        .bg-overweight { background: var(--accent-overweight); }
        
        .category-obese { color: var(--accent-obese); }
        .bg-obese { background: var(--accent-obese); }

    </style>
</head>
<body>
    <div class="bmi-widget">
        <div class="header">
            <span class="title">Health Report</span>
            <span id="badge" class="badge">BMI Analysis</span>
        </div>

        <div class="bmi-value-container">
            <div id="bmi-number" class="bmi-number">24.5</div>
            <div id="category-label" class="category-label">Normal weight</div>
        </div>

        <div class="gauge-container">
            <div id="gauge-bar" class="gauge-bar"></div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Ideal Min</div>
                <div id="ideal-min" class="stat-value">62.5 kg</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Ideal Max</div>
                <div id="ideal-max" class="stat-value">84.2 kg</div>
            </div>
        </div>
    </div>

    <script>
        function updateWidget(data) {
            const bmi = data.bmi;
            const category = data.category;
            
            const numEl = document.getElementById('bmi-number');
            const labelEl = document.getElementById('category-label');
            const barEl = document.getElementById('gauge-bar');
            const badgeEl = document.getElementById('badge');
            
            numEl.textContent = bmi.toFixed(1);
            labelEl.textContent = category;
            
            // Map category to color
            let colorClass = 'normal';
            let percentage = 0;

            if (category === "Underweight") {
                colorClass = 'underweight';
                percentage = Math.min((bmi / 18.5) * 25, 25);
            } else if (category === "Normal weight") {
                colorClass = 'normal';
                percentage = 25 + ((bmi - 18.5) / 6.5) * 25;
            } else if (category === "Overweight") {
                colorClass = 'overweight';
                percentage = 50 + ((bmi - 25) / 5) * 25;
            } else {
                colorClass = 'obese';
                percentage = Math.min(75 + ((bmi - 30) / 10) * 25, 100);
            }

            labelEl.className = 'category-label category-' + colorClass;
            barEl.className = 'gauge-bar bg-' + colorClass;
            badgeEl.className = 'badge bg-' + colorClass;
            
            setTimeout(() => {
                barEl.style.width = percentage + '%';
            }, 100);

            document.getElementById('ideal-min').textContent = data.ideal_weight_min.toFixed(1) + ' kg';
            document.getElementById('ideal-max').textContent = data.ideal_weight_max.toFixed(1) + ' kg';
        }

        // This would be replaced by actual data in the server response
        // updateWidget({bmi: 24.5, category: "Normal weight", ideal_weight_min: 62.1, ideal_weight_max: 83.5});
    </script>
</body>
</html>
