[tool.poetry]
name = "bmi-mcp"
version = "0.1.0"
description = "A production-ready BMI MCP server for ChatGPT Apps"
authors = ["Antigravity <antigravity@gemini.ai>"]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.109.0"
uvicorn = "^0.27.0"
pydantic = "^2.6.0"
httpx = "^0.26.0"
mcp = {extras = ["sse"], version = "^1.2.1"}

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
